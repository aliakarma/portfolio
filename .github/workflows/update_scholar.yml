name: Update Scholar Stats

on:
  schedule:
    - cron: '30 2 * * 1' # Every Monday at 2:30 AM UTC (weekly)
  workflow_dispatch: # Allow manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    # Least privilege: this job only commits data/scholar.json back to the
    # repo. Without an explicit block the job inherits the repository default,
    # which may grant write access to issues, packages, deployments and more.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Google Scholar rate-limits datacenter IPs, and GitHub's runners share a
      # pool of them, so a single blocked attempt is not evidence the profile
      # changed. Retry a few times, spaced out; the script picks fresh mirrors
      # each run and writes nothing unless it gets a clean read.
      - name: Fetch Scholar metrics
        env:
          SCHOLAR_USER_ID: 'kQZZJtYAAAAJ'
        run: |
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            if node scripts/update_scholar.js; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            [ "$attempt" -lt 3 ] && sleep 120
          done
          echo "::error title=Google Scholar unreachable::Could not read the Scholar profile after 3 attempts. data/scholar.json is unchanged — update it manually with 'npm run scholar:manual -- <citations> <hIndex> <i10Index>'."
          exit 1

      - name: Commit and push if changed
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/scholar.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: automated update of scholar metrics" && git push)
